<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق قريب - Qareeb PWA</title>
<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    margin: 0;
    padding: 0;
    background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url("https://images.unsplash.com/photo-1564769625905-50e93615e769?auto=format&fit=crop&w=2000&q=100");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    direction: rtl;
}

header {
    background: rgba(17, 24, 39, 0.95);
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #fbbf24;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

header h1 {
    color: #ffd700;
    margin: 0;
    font-size: 28px;
}

.user-bar {
    display: flex;
    gap: 15px;
    align-items: center;
}

.main-container {
    max-width: 1400px;
    margin: 20px auto;
    padding: 20px;
}

.box {
    background: rgba(0, 0, 0, 0.65);
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    margin-bottom: 30px;
}

h2 {
    color: #fbbf24;
    border-bottom: 2px solid #fbbf24;
    padding-bottom: 10px;
    margin-top: 0;
}

/* شبكة الأزرار الصوتية */
.voice-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.voice-btn {
    background: linear-gradient(135deg, #059669, #10b981);
    color: white;
    border: none;
    padding: 25px 15px;
    border-radius: 15px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.voice-btn:hover {
    transform: translateY(-5deg) scale(1.02);
    box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
    background: linear-gradient(135deg, #10b981, #34d399);
}

.voice-btn:active {
    transform: scale(0.98);
}

/* مدخلات ومستلزمات الحساب والقرآن */
input, select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: rgba(15, 23, 42, 0.8);
    color: white;
    font-size: 16px;
    margin-top: 10px;
    margin-bottom: 15px;
}

input:focus, select:focus {
    outline: none;
    border-color: #fbbf24;
}

button.action-btn {
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: #fbbf24;
    color: #111827;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

button.action-btn:hover {
    background: #f59e0b;
}

audio {
    width: 100%;
    margin-top: 15px;
    border-radius: 10px;
}

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    width: 90%;
    max-width: 450px;
    position: relative;
    border: 1px solid #fbbf24;
}

.close-btn {
    position: absolute;
    top: 10px; left: 15px;
    color: white;
    font-size: 24px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <h1>تطبيق قريب 🤲</h1>
    <div class="user-bar" id="userArea">
        <button class="action-btn" onclick="openAuthModal()">إنشاء حساب / دخول</button>
    </div>
</header>

<div class="main-container">

    <!-- قسم الاحتياجات والتعبير الصوتي -->
    <div class="box">
        <h2>🔊 أزرار الاحتياجات السريعة (تحدث بصوت)</h2>
        <p>اضغط على أي زر للطق العبارة فوراً:</p>
        <div class="voice-grid">
            <button class="voice-btn" onclick="speak('أنا أحتاج مساعدة من فضلك')">
                <span>✋</span>
                <span>أحتاج مساعدة</span>
            </button>
            <button class="voice-btn" onclick="speak('أنا أشعر بألم شديد')">
                <span>😣</span>
                <span>أشعر بالألم</span>
            </button>
            <button class="voice-btn" onclick="speak('أنا أريد شرب الماء')">
                <span>💧</span>
                <span>أحتاج ماء</span>
            </button>
            <button class="voice-btn" onclick="speak('أريد تناول الدواء الآن')">
                <span>💊</span>
                <span>أحتاج دواء</span>
            </button>
            <button class="voice-btn" onclick="speak('أشعر بالنعاس وأريد النوم')">
                <span>😴</span>
                <span>أريد النوم</span>
            </button>
            <button class="voice-btn" onclick="speak('الحمد لله رب العالمين')">
                <span>❤️</span>
                <span>الحمد لله</span>
            </button>
        </div>
    </div>

    <!-- قسم القرآن الكريم الكامل والبحث -->
    <div class="box">
        <h2>📖 القرآن الكريم كامل (114 سورة) بصوت مشاري العفاسي</h2>
        
        <label>🔍 بحث سريع عن سورة:</label>
        <input type="text" id="quranSearch" placeholder="اكتب اسم السورة (مثلاً: البقرة، يس، الملك...)" oninput="filterSurahs()">

        <label>اختر السورة للاستماع:</label>
        <select id="surahSelect" onchange="changeSurah()"></select>
        
        <audio id="audioPlayer" controls></audio>
    </div>

</div>

<!-- نافذة إنشاء حساب / تسجيل دخول -->
<div class="modal" id="authModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAuthModal()">&times;</span>
        <h2 style="text-align:center;">تسجيل الدخول / حساب جديد</h2>
        <input type="text" id="usernameInput" placeholder="اسم المستخدم">
        <input type="password" placeholder="كلمة السر">
        <button class="action-btn" style="width:100%;" onclick="saveUser()">دخول</button>
    </div>
</div>

<footer style="padding:20px; background:#111827; text-align:center; color:#cbd5e1; border-top:1px solid #334155;">
    © تطبيق قريب - جميع الحقوق محفوظة
</footer>

<script>
// 1. نظام نطق الصوت المباشر للأزرار (مضمون 100% على الموبايل)
function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // إيقاف أي صوت سابق
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA'; // اللغة العربية
        utterance.rate = 0.9;     // سرعة واضحة
        window.speechSynthesis.speak(utterance);
    } else {
        alert("متصفحك لا يدعم خاصية نطق الصوت المباشر");
    }
}

// 2. قائمة سور القرآن الكريم والتشغيل
const baseURL = "https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/";
const surahs = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

const select = document.getElementById("surahSelect");
const audio = document.getElementById("audioPlayer");

function loadSurahs(filter = "") {
    select.innerHTML = "";
    surahs.forEach((s, i) => {
        if (s.includes(filter)) {
            let opt = document.createElement("option");
            opt.value = i + 1;
            opt.textContent = (i + 1) + " - سورة " + s;
            select.appendChild(opt);
        }
    });
    if (select.options.length > 0) {
        changeSurah();
    }
}

function changeSurah() {
    let num = select.value;
    if(!num) return;
    let file = num.toString().padStart(3, '0') + ".mp3";
    audio.src = baseURL + file;
}

function filterSurahs() {
    let query = document.getElementById("quranSearch").value.trim();
    loadSurahs(query);
}

// 3. نظام إنشاء الحساب البسيط
function openAuthModal() {
    document.getElementById("authModal").style.display = "flex";
}

function closeAuthModal() {
    document.getElementById("authModal").style.display = "none";
}

function saveUser() {
    let name = document.getElementById("usernameInput").value;
    if(name.trim() !== "") {
        localStorage.setItem("qareeb_user", name);
        checkUser();
        closeAuthModal();
    }
}

function checkUser() {
    let user = localStorage.getItem("qareeb_user");
    if(user) {
        document.getElementById("userArea").innerHTML = `<span>أهلاً بك، <b>${user}</b> 👋</span> <button class="action-btn" onclick="logout()" style="background:#ef4444; color:white;">خروج</button>`;
    }
}

function logout() {
    localStorage.removeItem("qareeb_user");
    location.reload();
}

// تشغيل أولي
loadSurahs();
checkUser();
</script>

</body>
</html>
